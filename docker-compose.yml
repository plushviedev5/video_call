# ============================================
# Docker Compose — Development Stack
# ============================================

version: '3.9'

services:
  # -----------------------------------------------------------------------
  # Application
  # -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videocall-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/videocall?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-at-least-32chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-at-least-32chars!!}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      METRICS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - videocall

  # -----------------------------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: videocall-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videocall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videocall

  # -----------------------------------------------------------------------
  # Redis
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: videocall-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - videocall

  # -----------------------------------------------------------------------
  # Nginx (TLS termination + reverse proxy)
  # -----------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: videocall-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certs here in production
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - videocall

  # -----------------------------------------------------------------------
  # coturn (TURN/STUN server for WebRTC NAT traversal)
  # -----------------------------------------------------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: videocall-coturn
    restart: unless-stopped
    ports:
      - '3478:3478'       # STUN/TURN
      - '3478:3478/udp'
      - '5349:5349'       # STUN/TURN over TLS
      - '5349:5349/udp'
      - '49152-49200:49152-49200/udp'  # Relay ports
    command: >
      -n
      --realm=videocall.local
      --fingerprint
      --lt-cred-mech
      --user=videocall:videocall123
      --min-port=49152
      --max-port=49200
      --log-file=stdout
      --no-tls
      --no-dtls
    networks:
      - videocall

volumes:
  postgres_data:
  redis_data:

networks:
  videocall:
    driver: bridge
